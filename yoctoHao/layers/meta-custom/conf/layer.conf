# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-custom"
BBFILE_PATTERN_meta-custom = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-custom = "6"

# This should only be incremented on significant metadata layer changes that would
# cause compatibility issues with other layers
LAYERVERSION_meta-custom = "1"

# We recommend updating layer version when we change metadata to track the version
# of this layer when it was pulled for inclusion in other metadata layers
LAYERDEPENDS_meta-custom = "core"

# Set a variable to get to the top of the metadata location
CUSTOM_LAYER = "${LAYERDIR}"

# Custom layer description
LAYERSERIES_COMPAT_meta-custom = "wrynose blacksail scarthgap nanbield mickledore langdale kirkstone honister hardknott gatesgarth dunfell"
